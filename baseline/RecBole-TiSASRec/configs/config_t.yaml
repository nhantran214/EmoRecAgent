# AC-TSR shared training / eval recipe (config/config_t.yaml).
epochs: 200
train_batch_size: 256
learner: adam
learning_rate: 0.0001
eval_step: 1
stopping_step: 10
clip_grad_norm: ~
weight_decay: 0.0
neg_sampling:

eval_args:
  split: { 'LS': 'valid_and_test' }
  group_by: user
  order: TO
  mode: full

repeatable: True
# Hit@K == Recall@K under single-positive LOO; include both for Table 1 naming.
metrics: ["Recall", "Hit", "MRR", "NDCG"]
topk: [10, 20]
valid_metric: Recall@10
valid_metric_bigger: True
eval_batch_size: 256
loss_decimal_place: 4
metric_decimal_place: 4
