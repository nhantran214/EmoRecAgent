# Yelp_AC dataset overlay for RecBole TiSASRec.
#
# Combined interactions exported from data/processed/Yelp_AC JSONL.
# RecBole applies leave-last-out (LS: valid_and_test) — same protocol as AC-TSR.

gpu_id: '0'
use_gpu: True
seed: 42
state: INFO
reproducibility: True
show_progress: True
save_dataset: False
save_dataloaders: False

# Filled at runtime by run_experiment.py (absolute paths).
data_path: 'dataset'
checkpoint_dir: 'checkpoints'

load_col:
  inter: [user_id, item_id, rating, timestamp]

USER_ID_FIELD: user_id
ITEM_ID_FIELD: item_id
RATING_FIELD: rating
TIME_FIELD: timestamp
MAX_ITEM_LIST_LENGTH: 50

# Already 5-core in EmoRecAgent build_dataset — do not refilter.
filter_inter_by_user_or_item: False
user_inter_num_interval: "[0,inf)"
item_inter_num_interval: "[0,inf)"
