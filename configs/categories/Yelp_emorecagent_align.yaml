# Protocol B Stage-2 rerank eval for Yelp (same method as Beauty / Sports / Toys).
extends: Yelp.yaml

experiment:
  name: emorecagent_align_Yelp

eval:
  protocol: user_batch
  aggregation: user_mean
  k_values: [10, 20]
  hr_avg_k: [1, 3, 5]

tisasrec_align:
  use_hash_encoder: true
  stage1_only: false
  stage2_mode: rerank
  rerank_pool_k: 100
  llm_pool_cap: 40
  # Membership-preserving merge: the LLM permutes only Stage-1's top-10, so
  # hr@k / recall@k (k >= 10) cannot regress while ndcg/hr@1/mrr can improve.
  # The legacy position guardrail reverted net-positive reranks (see ablation).
  guardrail_mode: reorder_head
  reorder_head_n: 10
