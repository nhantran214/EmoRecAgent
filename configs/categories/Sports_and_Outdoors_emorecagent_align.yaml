# Protocol B Stage-2 rerank eval for Sports and Outdoors (same method as Beauty).
extends: Sports_and_Outdoors.yaml

experiment:
  name: emorecagent_align_Sports_and_Outdoors

eval:
  protocol: user_batch
  aggregation: user_mean
  k_values: [10, 20]
  hr_avg_k: [1, 3, 5]

tisasrec_align:
  use_hash_encoder: true
  stage1_only: false
  stage2_mode: rerank
  rerank_pool_k: 100
  llm_pool_cap: 40
