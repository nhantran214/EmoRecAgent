# Category overlay: Amazon Sports and Outdoors (same hyperparameters as default).
# All writable artifacts are under Sports paths — never touches Beauty caches.
# Usage: --config configs/categories/Sports_and_Outdoors.yaml
extends: ../default.yaml

experiment:
  name: Sports_and_Outdoors

data:
  category: Sports_and_Outdoors
  review_path: data/amazon-reviews-2023/raw/review_categories/Sports_and_Outdoors.jsonl
  meta_path: data/amazon-reviews-2023/raw/meta_categories/meta_Sports_and_Outdoors.jsonl
  out_dir: data/processed/Sports_and_Outdoors

absa:
  targets_path: data/processed/Sports_and_Outdoors/absa_targets.jsonl
  cache_path: data/processed/Sports_and_Outdoors/absa_cache.sqlite
  gold_path: data/labeled/Sports_and_Outdoors/absa_gold.jsonl
  summary_path: results/Sports_and_Outdoors/absa_summary.json
  preview_html_path: results/Sports_and_Outdoors/absa_preview.html

tisasrec_align:
  stage1_checkpoint_path: data/processed/Sports_and_Outdoors/tisasrec_align/stage1_checkpoint.pt
  e_i_matrix_path: data/processed/Sports_and_Outdoors/tisasrec_align/e_i_matrix.pt
  alignment_checkpoint_path: data/processed/Sports_and_Outdoors/tisasrec_align/alignment_mlp.pt
  tu_cache_path: data/processed/Sports_and_Outdoors/tisasrec_align/tu_cache.jsonl
  cross_user_lookup_path: data/processed/Sports_and_Outdoors/tisasrec_align/cross_user_lookup.json

hettisasrec:
  aspect_vocab_path: data/processed/Sports_and_Outdoors/hettisasrec/aspect_vocab.json
  aspect_graph_path: data/processed/Sports_and_Outdoors/hettisasrec/aspect_graph.pt
  checkpoint_path: data/processed/Sports_and_Outdoors/hettisasrec/checkpoint.pt
