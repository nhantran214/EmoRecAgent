services:
  neo4j:
    image: neo4j:5.22
    container_name: emorecagent-neo4j
    # Host ports 7475/7688 avoid clashing with other local Neo4j instances on 7474/7687.
    ports:
      - "7475:7474"   # HTTP browser  -> http://localhost:7475
      - "7688:7687"   # Bolt          -> bolt://localhost:7688
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-emorecagent}"
      NEO4J_server_memory_heap_initial__size: "1G"
      NEO4J_server_memory_heap_max__size: "2G"
      NEO4J_server_memory_pagecache_size: "1G"
    volumes:
      - ./neo4j_data:/data
      - ./neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
